<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Example Store — Bitnormous SDK demo</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400..700&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --violet: #532880;
        --amber: #ea8e26;
        --ink: #242424;
        --muted: #6d6579;
        --line: #e9e4f2;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        background: #f6f4fa;
        color: var(--ink);
        font-family: 'Instrument Sans', system-ui, sans-serif;
      }
      .card {
        width: 100%;
        max-width: 380px;
        background: #fff;
        border: 1px solid var(--line);
        border-radius: 18px;
        padding: 24px;
        box-shadow: 0 12px 32px -12px rgba(38, 16, 60, 0.13);
      }
      .eyebrow { font-size: 11px; letter-spacing: 0.07em; text-transform: uppercase; color: var(--muted); margin: 0; }
      h1 { font-size: 19px; margin: 4px 0 0; letter-spacing: -0.01em; }
      .thumb {
        height: 132px;
        margin: 18px 0;
        border-radius: 12px;
        background: linear-gradient(135deg, var(--amber) 0%, #9e72ce 100%);
      }
      .row { display: flex; justify-content: space-between; align-items: baseline; }
      .price { font-size: 28px; font-weight: 600; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; }
      .ref { font-size: 12px; color: var(--muted); font-family: ui-monospace, monospace; }
      button {
        width: 100%;
        margin-top: 18px;
        padding: 13px;
        border: 0;
        border-radius: 12px;
        background: var(--violet);
        color: #fff;
        font: inherit;
        font-weight: 600;
        font-size: 14px;
        cursor: pointer;
      }
      button:hover { background: #69389f; }
      button:disabled { opacity: 0.55; cursor: progress; }
      #status { margin-top: 14px; font-size: 13px; color: var(--muted); min-height: 19px; text-align: center; }
      #status[data-tone='ok'] { color: #059669; font-weight: 600; }
      #status[data-tone='bad'] { color: #dc2626; }
    </style>
  </head>
  <body>
    <main class="card">
      <p class="eyebrow">Example Store</p>
      <h1>Hand-roasted coffee, 1kg</h1>
      <div class="thumb"></div>

      <div class="row">
        <span class="price">$125.00</span>
        <span class="ref">ORDER-102938</span>
      </div>

      <button id="pay">Pay with crypto</button>
      <p id="status" role="status" aria-live="polite"></p>
    </main>

    <!-- Stands in for a bundler: resolves the SDK's bare import of its core package. -->
    <script type="importmap">
      { "imports": { "@bitnormous/business-core": "/core/index.js" } }
    </script>

    <script type="module">
      import { BitnormousCheckout } from '/sdk/index.js';

      const button = document.querySelector('#pay');
      const status = document.querySelector('#status');

      const say = (text, tone = '') => {
        status.textContent = text;
        status.dataset.tone = tone;
      };

      // The SDK posts the order to our own endpoint, which creates the session server-side.
      // No API key reaches this file.
      const checkout = new BitnormousCheckout({
        createSession: '/api/bitnormous/checkout',
        checkoutUrl: window.CHECKOUT_URL ?? 'http://localhost:5180',
      });

      button.addEventListener('click', async () => {
        button.disabled = true;
        say('Opening secure checkout…');

        try {
          const result = await checkout.open({
            reference: 'ORDER-102938',
            onStatusChange: (session) => say(`Status: ${session.status}`),
          });

          if (result.status === 'success') {
            // What the customer sees. The order is fulfilled by the webhook, not by this line.
            say('Payment successful — thank you!', 'ok');
          } else if (result.status === 'dismissed') {
            say('Checkout closed. Your order is still waiting.');
          } else {
            say(`Checkout ended: ${result.status}`, 'bad');
          }
        } catch (error) {
          say(error.message, 'bad');
        } finally {
          button.disabled = false;
        }
      });
    </script>
  </body>
</html>
